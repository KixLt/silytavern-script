<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>模拟页 · 输入框上方状态栏 (楼层可见 + AI 监控)</title>
<style>
    :root {
        --SmartThemeBodyColor: #e9e6df;
        --SmartThemeEmColor: #9a958c;
        --SmartThemeUnderlineColor: #a9c8a0;
        --SmartThemeBlurTintColor: #1b1d21;
        --SmartThemeQuoteColor: #e08a4a;
        --mainFontFamily: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; margin: 0; }

    body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-family: var(--mainFontFamily);
        font-size: 14px;
        color: var(--SmartThemeBodyColor);
        background:
            radial-gradient(120% 90% at 80% 0%, #2a2f36 0%, transparent 60%),
            linear-gradient(180deg, #15171a, #101215);
    }

    /* 模拟页标记: 说明这是酒馆外壳的替身, 不是脚本界面的一部分 */
    .demo-banner {
        display: flex;
        flex: 0 0 auto;
        gap: 10px;
        align-items: baseline;
        flex-wrap: wrap;
        padding: 8px 16px;
        font-size: 11px;
        color: var(--SmartThemeEmColor);
        border-bottom: 1px solid rgba(233, 230, 223, 0.1);
    }

    .demo-banner b { font-weight: 600; color: var(--SmartThemeBodyColor); }
    .demo-banner code { font-size: 11px; opacity: 0.75; }

    .demo-banner span { min-width: 0; }

    /* 聊天区 */
    #chat {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        padding: 16px 18px 4px;
    }

    #chat-inner {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
    }

    .mes {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 10px;
        padding: 9px 11px;
        background: rgba(233, 230, 223, 0.04);
        border: 1px solid rgba(233, 230, 223, 0.08);
        border-radius: 9px;
    }

    .mes[data-role="user"] {
        background: rgba(169, 200, 160, 0.07);
        border-color: rgba(169, 200, 160, 0.18);
    }

    .mes.is-hidden { opacity: 0.42; }

    .mes.is-hidden .mes-text {
        text-decoration: line-through;
        text-decoration-thickness: 1px;
    }

    .mes-avatar {
        width: 34px;
        height: 34px;
        font-size: 11px;
        line-height: 34px;
        text-align: center;
        color: var(--SmartThemeEmColor);
        background: rgba(233, 230, 223, 0.08);
        border-radius: 6px;
    }

    .mes-head {
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin-bottom: 2px;
        font-size: 11px;
        color: var(--SmartThemeEmColor);
    }

    .mes-name { font-weight: 600; color: var(--SmartThemeBodyColor); }

    .mes-text {
        margin: 0;
        font-size: 13.5px;
        line-height: 1.6;
        white-space: pre-wrap;
    }

    /* 输入区: 脚本把状态栏行插在 #send_form 前面 */
    #form_sheld {
        flex: 0 0 auto;
        width: 100%;
        max-width: 760px;
        margin: 0 auto;
        padding: 0 18px 14px;
    }

    #send_form {
        display: flex;
        gap: 8px;
        align-items: flex-end;
        padding: 6px;
        background: rgba(233, 230, 223, 0.05);
        border: 1px solid rgba(233, 230, 223, 0.12);
        border-radius: 10px;
    }

    #send_textarea {
        flex: 1 1 auto;
        min-height: 42px;
        max-height: 120px;
        padding: 8px 6px;
        font: inherit;
        font-size: 13.5px;
        color: var(--SmartThemeBodyColor);
        background: transparent;
        border: 0;
        outline: none;
        resize: none;
    }

    .demo-btn {
        flex: 0 0 auto;
        padding: 7px 12px;
        font: inherit;
        font-size: 12px;
        color: var(--SmartThemeBodyColor);
        background: rgba(233, 230, 223, 0.08);
        border: 1px solid rgba(233, 230, 223, 0.14);
        border-radius: 7px;
        cursor: pointer;
    }

    .demo-btn:hover { background: rgba(233, 230, 223, 0.14); }

    #demo-toast {
        position: fixed;
        right: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        z-index: 99999;
        pointer-events: none;
    }

    #demo-toast div {
        padding: 6px 10px;
        font-size: 12px;
        background: #262a30;
        border: 1px solid rgba(233, 230, 223, 0.16);
        border-radius: 7px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }
</style>
</head>
<body>
<div class="demo-banner">
    <b>酒馆模拟页</b>
    <span>输入框上方一行 = 楼层可见（窄条 300px）+ AI 请求监控（占剩余；拖标题栏可拖出成浮窗，双击回位）</span>
    <code>scripts/demo/tavern-mock.html</code>
</div>

<div id="chat"><div id="chat-inner"></div></div>

<div id="form_sheld">
    <div id="send_form">
        <button class="demo-btn" type="button" id="demo-send">发送</button>
        <textarea id="send_textarea" rows="1" placeholder="输入消息…"></textarea>
        <button class="demo-btn" type="button" id="demo-request" title="模拟一次 AI 请求, 让监控面板收到数据">模拟请求</button>
    </div>
</div>

<div id="demo-toast"></div>

<script src="./mock-tavern.js"></script>
<script src="../../dist/message-visibility/index.js"></script>
<script src="../../dist/ai-monitor/tt-ai-monitor.js"></script>
</body>
</html>
