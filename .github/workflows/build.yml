name: build

on:
  push:
    branches: [master]
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本由 package.json 的 packageManager 字段决定, 这里不再写 version (两者同时存在会报错)
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # pnpm -r 逐个包执行, 任一包失败即中断
      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # 一次构建产出两个文件, 都由 jsDelivr 直接从 master 读取:
      #   dist/build/index.js                剧情进度状态栏
      #   dist/ai-monitor/TT-AI-Monitor.json AI 请求监控 (另附 tt-ai-monitor.js 源文件)
      # 提交只改 dist/, 不匹配上面的 paths, 不会触发下一轮构建.
      - name: Commit dist
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo "dist 没有变化, 跳过提交"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist
          git commit -m 'chore: 更新构建产物 [skip ci]'
          git push
