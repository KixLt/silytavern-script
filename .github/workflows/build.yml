name: build

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vite.config.ts'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # 产物由 jsDelivr 直接从 master 读取, 因此构建后回写仓库;
      # 提交只改 dist/build, 不匹配上面的 paths, 不会触发下一轮构建.
      - name: Commit dist/build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          if [ -z "$(git status --porcelain -- dist/build)" ]; then
            echo "dist/build 没有变化, 跳过提交"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/build
          git commit -m 'chore: 更新构建产物 [skip ci]'
          git push
